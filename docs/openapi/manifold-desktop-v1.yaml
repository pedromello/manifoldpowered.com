openapi: 3.1.0
info:
  title: Manifold Distribution API
  version: 1.0.0
  description: Client-neutral contract for Manifold authentication and release distribution.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: /api/v1
security: []
paths:
  /otp:
    post:
      summary: Request a passwordless login code
      operationId: requestOtp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestOtpRequest"
      responses:
        "201":
          description: The one-time code was accepted for delivery.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpRequested"
        "400":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /otp/sessions:
    post:
      summary: Verify a one-time code and create a cookie session
      operationId: createOtpSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionRequest"
      responses:
        "201":
          description: Authenticated session.
          headers:
            Set-Cookie:
              description: Secure, HTTP-only `session_id` cookie.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /sessions:
    delete:
      summary: Revoke the current session
      operationId: revokeSession
      security:
        - cookieAuth: []
      responses:
        "204":
          description: Session revoked.
          headers:
            Set-Cookie:
              description: Clears the `session_id` cookie.
              schema:
                type: string
        "400":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /games:
    get:
      summary: List games
      operationId: listGames
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Paginated public catalog.
          content:
            application/json:
              schema:
                type: object
                required: [games, pagination]
                properties:
                  games:
                    type: array
                    items:
                      $ref: "#/components/schemas/CatalogGame"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
        "400":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /library:
    get:
      summary: List the current user's library with compatible releases
      operationId: listLibrary
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/Platform"
        - $ref: "#/components/parameters/Architecture"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Entitled games and their latest compatible releases.
          content:
            application/json:
              schema:
                type: object
                required: [items, pagination]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/LibraryItem"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
        "400":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /games/{slug}/releases/latest:
    get:
      summary: Resolve the latest compatible game release
      operationId: getLatestCompatibleRelease
      security:
        - cookieAuth: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/Platform"
        - $ref: "#/components/parameters/Architecture"
      responses:
        "200":
          description: Latest published release compatible with the target.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReleaseSummary"
        "400":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /releases/{release_id}/manifest:
    get:
      summary: Get a release install manifest
      operationId: getInstallManifest
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/ReleaseId"
        - name: schema_version
          in: query
          required: true
          schema:
            const: "1"
      responses:
        "200":
          description: Versioned install manifest.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstallManifest"
        "400":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /artifacts/{artifact_id}/download:
    post:
      summary: Authorize an artifact download
      operationId: authorizeArtifactDownload
      security:
        - cookieAuth: []
      parameters:
        - name: artifact_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Identifier"
      responses:
        "200":
          description: Refreshable authorization for an immutable artifact.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadAuthorization"
        "400":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /releases/{release_id}/patches:
    get:
      summary: List compatible patches for a release
      operationId: listReleasePatches
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/ReleaseId"
        - $ref: "#/components/parameters/Platform"
        - $ref: "#/components/parameters/Architecture"
      responses:
        "200":
          description: Published patches targeting the release.
          content:
            application/json:
              schema:
                type: object
                required: [patches]
                properties:
                  patches:
                    type: array
                    items:
                      $ref: "#/components/schemas/ReleasePatch"
        "400":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: session_id
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Platform:
      name: platform
      in: query
      required: true
      schema:
        $ref: "#/components/schemas/Platform"
    Architecture:
      name: arch
      in: query
      required: true
      schema:
        $ref: "#/components/schemas/Architecture"
    ReleaseId:
      name: release_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Identifier"
  responses:
    Error:
      description: API error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    Identifier:
      type: string
      format: uuid
    Timestamp:
      type: string
      format: date-time
    ByteSize:
      type: string
      pattern: "^(0|[1-9][0-9]*)$"
      description: Unsigned byte count encoded as a base-10 string.
    Sha256:
      type: string
      pattern: "^[a-f0-9]{64}$"
    Platform:
      type: string
      enum: [WINDOWS, MAC, LINUX]
    Architecture:
      type: string
      enum: [X86_64, AARCH64]
    Target:
      type: object
      additionalProperties: false
      required: [platform, architecture]
      properties:
        platform:
          $ref: "#/components/schemas/Platform"
        architecture:
          $ref: "#/components/schemas/Architecture"
    RequestOtpRequest:
      type: object
      additionalProperties: false
      required: [login]
      properties:
        login:
          type: string
          minLength: 1
    OtpRequested:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        message:
          type: string
    CreateSessionRequest:
      type: object
      additionalProperties: false
      required: [login, code]
      properties:
        login:
          type: string
          minLength: 1
        code:
          type: string
          pattern: "^[0-9]{6}$"
    Session:
      type: object
      additionalProperties: false
      required: [id, token, user_id, expires_at, created_at, updated_at]
      properties:
        id:
          $ref: "#/components/schemas/Identifier"
        token:
          type: string
          description: Legacy response field. Cookie-based clients must not expose it to untrusted UI code.
        user_id:
          $ref: "#/components/schemas/Identifier"
        expires_at:
          $ref: "#/components/schemas/Timestamp"
        created_at:
          $ref: "#/components/schemas/Timestamp"
        updated_at:
          $ref: "#/components/schemas/Timestamp"
    CatalogGame:
      type: object
      required: [id, slug, title, description, cover_url, platforms]
      properties:
        id:
          $ref: "#/components/schemas/Identifier"
        slug:
          type: string
        title:
          type: string
        description:
          type: string
        cover_url:
          type: [string, "null"]
          format: uri
        platforms:
          type: array
          items:
            $ref: "#/components/schemas/Platform"
    ReleaseSummary:
      type: object
      required:
        [
          id,
          version,
          release_number,
          published_at,
          artifact_id,
          target,
          compressed_size_bytes,
          installed_size_bytes,
          sha256,
          manifest_schema_version,
        ]
      properties:
        id:
          $ref: "#/components/schemas/Identifier"
        version:
          type: string
        release_number:
          type: integer
          minimum: 1
        published_at:
          $ref: "#/components/schemas/Timestamp"
        artifact_id:
          $ref: "#/components/schemas/Identifier"
        target:
          $ref: "#/components/schemas/Target"
        compressed_size_bytes:
          $ref: "#/components/schemas/ByteSize"
        installed_size_bytes:
          $ref: "#/components/schemas/ByteSize"
        sha256:
          $ref: "#/components/schemas/Sha256"
        manifest_schema_version:
          const: "1"
    LibraryItem:
      type: object
      required: [game, acquired_at, latest_compatible_release]
      properties:
        game:
          $ref: "#/components/schemas/CatalogGame"
        acquired_at:
          $ref: "#/components/schemas/Timestamp"
        latest_compatible_release:
          oneOf:
            - $ref: "#/components/schemas/ReleaseSummary"
            - type: "null"
    InstallManifest:
      type: object
      additionalProperties: false
      required:
        [
          schema_version,
          release_id,
          artifact_id,
          entrypoint,
          launch_arguments,
          executables,
          environment,
        ]
      properties:
        schema_version:
          const: "1"
        release_id:
          $ref: "#/components/schemas/Identifier"
        artifact_id:
          $ref: "#/components/schemas/Identifier"
        entrypoint:
          type: string
        launch_arguments:
          type: array
          items:
            type: string
        working_directory:
          type: string
        executables:
          type: array
          items:
            type: string
        environment:
          type: object
          additionalProperties:
            type: string
    DownloadAuthorization:
      type: object
      required: [artifact_id, url, expires_at, total_size_bytes, sha256]
      properties:
        artifact_id:
          $ref: "#/components/schemas/Identifier"
        url:
          type: string
          format: uri
        expires_at:
          $ref: "#/components/schemas/Timestamp"
        total_size_bytes:
          $ref: "#/components/schemas/ByteSize"
        sha256:
          $ref: "#/components/schemas/Sha256"
        etag:
          type: string
    ReleasePatch:
      type: object
      required:
        [
          id,
          source_release_id,
          target_release_id,
          target,
          algorithm,
          format_version,
          size_bytes,
          sha256,
          expected_installation_sha256,
          published_at,
        ]
      properties:
        id:
          $ref: "#/components/schemas/Identifier"
        source_release_id:
          $ref: "#/components/schemas/Identifier"
        target_release_id:
          $ref: "#/components/schemas/Identifier"
        target:
          $ref: "#/components/schemas/Target"
        algorithm:
          type: string
        format_version:
          type: string
        size_bytes:
          $ref: "#/components/schemas/ByteSize"
        sha256:
          $ref: "#/components/schemas/Sha256"
        expected_installation_sha256:
          $ref: "#/components/schemas/Sha256"
        published_at:
          $ref: "#/components/schemas/Timestamp"
    Pagination:
      type: object
      required: [page, limit, total, pages]
      properties:
        page:
          type: integer
          minimum: 1
        limit:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
        pages:
          type: integer
          minimum: 0
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, retryable]
          properties:
            code:
              type: string
              enum:
                [
                  INVALID_REQUEST,
                  UNSUPPORTED_API_VERSION,
                  UNSUPPORTED_MANIFEST_VERSION,
                  AUTHENTICATION_REQUIRED,
                  INVALID_CREDENTIALS,
                  SESSION_EXPIRED,
                  SESSION_REVOKED,
                  ACCOUNT_DISABLED,
                  ENTITLEMENT_REQUIRED,
                  NO_COMPATIBLE_RELEASE,
                  RELEASE_RETIRED,
                  INTEGRITY_FAILURE,
                  RATE_LIMITED,
                  SERVICE_UNAVAILABLE,
                ]
            message:
              type: string
            retryable:
              type: boolean
            request_id:
              type: string
            details:
              type: object
              additionalProperties: true
