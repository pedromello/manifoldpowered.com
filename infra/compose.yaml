services:
  database:
    container_name: "postgres-dev"
    image: postgres:16.0-alpine3.18
    env_file:
      - ../.env.development
    ports:
      - "6432:5432"
  mailcatcher:
    container_name: "mailcatcher-dev"
    image: sj26/mailcatcher
    ports:
      - "1025:1025"
      - "1080:1080"
  rustfs:
    container_name: "rustfs-dev"
    image: ghcr.io/rustfs/rustfs:1.0.0@sha256:8cc9801755448b71a786705ce76692c77e14936cccd87cf2fc31842e58f4d1ff
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - RUSTFS_ACCESS_KEY=local_access_key
      - RUSTFS_SECRET_KEY=local_secret_key
      - RUSTFS_ADDRESS=:9000
      - RUSTFS_CONSOLE_ADDRESS=:9001
      - RUSTFS_CONSOLE_ENABLE=true
      - RUSTFS_CORS_ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
    command: /data
