services:
  database:
    container_name: "postgres-dev"
    image: postgres:16.0-alpine3.18
    env_file:
      - ../.env.development
    ports:
      - "6432:5432"
  mailcatcher:
    container_name: "mailcatcher-dev"
    image: sj26/mailcatcher
    ports:
      - "1025:1025"
      - "1080:1080"
  object-storage:
    container_name: "seaweedfs-dev"
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    ports:
      # Keep the existing host endpoint so application configuration does not change.
      - "9000:8333"
    environment:
      - AWS_ACCESS_KEY_ID=local_access_key
      - AWS_SECRET_ACCESS_KEY=local_secret_key
    command: mini -dir=/data
